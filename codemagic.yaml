# The build machine. There is no Mac on the workstation, so this is the only place the
# iOS and watchOS targets are ever compiled -- and the only place a screen can be run.
#
# The domain package is tested first and alone. It is the part with real rules in it, it
# needs no simulator, and a failure there should stop the build before a minute is spent
# on anything with a screen.
workflows:
  vbcore:
    name: VBCore — the rulebook
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Test the domain, including parity with the shipped web app
        script: |
          cd packages/VBCore
          swift test
    triggering:
      events: [push, pull_request]

  # The cheapest way to find out whether 71 files of Swift compile.
  #
  # No signing, no simulators, no publishing, no upload. Just: does it build? Every error
  # this finds would otherwise have been found by a full build that spent forty minutes
  # getting there first, and the operator is paying for those minutes.
  compile:
    name: Does it compile?
    max_build_duration: 25
    environment:
      xcode: latest
    scripts:
      - name: The domain first, because it is cheapest and it holds the rules
        script: |
          cd packages/VBCore
          swift test

      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      # `build-for-testing` rather than `build`: it compiles the test targets too, and an
      # interface test that does not compile is a test that never runs.
      - name: Compile the phone, the watch, and their tests
        script: |
          xcodebuild build-for-testing             -project ios/VBTracker.xcodeproj             -scheme VBTracker             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO
      - name: Compile the watch on its own
        script: |
          xcodebuild build-for-testing             -project ios/VBTracker.xcodeproj             -scheme VBTrackerWatch             -destination 'generic/platform=watchOS Simulator'             CODE_SIGNING_ALLOWED=NO

    triggering:
      events: []

  ios-watch:
    name: iPhone and Watch
    max_build_duration: 60
    integrations:
      # Built once from the App Store Connect key, and reused by every future app.
      # The .p8 itself is uploaded to Codemagic by hand; the vault holds the copy every
      # other consumer uses.
      app_store_connect: RLL_Codemagic_CI_AppManager
    environment:
      xcode: latest
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY: the private half of the distribution certificate.
        # Apple issues the certificate, but only the holder of this key can use it -- so
        # without it the signing step can create a certificate and then not save it, which
        # is exactly what the first attempt did, quietly, while reporting success.
        - appstore_credentials
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Fetch the signing files, and create them where they do not exist yet.
      #
      # Declaring `ios_signing` only looks for profiles that are already there, and on a
      # brand new App ID there are none -- the first build died in under a second saying so.
      # `--create` makes the certificate and both profiles once, and finds them every time
      # after. Two bundle ids, because the watch app is signed as its own bundle.
      - name: Sign, creating the profiles the first time
        script: |
          app-store-connect fetch-signing-files "com.mikejsmith.vbtracker" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "com.mikejsmith.vbtracker.watchapp" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      # App Store Connect refuses a build number it has already seen, so the number comes
      # from the build itself rather than from a constant in the project that somebody has
      # to remember to raise.
      - name: Number this build
        script: |
          cd ios && agvtool new-version -all "$BUILD_NUMBER"

      - name: Test the domain first
        script: |
          cd packages/VBCore
          swift test

      - name: Build the phone and the watch it carries
        script: |
          xcode-project build-ipa \
            --project ios/VBTracker.xcodeproj \
            --scheme VBTracker

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      # Which app to publish to is read from the bundle id in the built IPA -- there is no
      # app_id field here, and the number lives in CLAUDE.md where identifiers belong.
      app_store_connect:
        auth: integration
        # Uploaded, and nothing more. `submit_to_testflight` submits for EXTERNAL beta
        # review, which demands a feedback email and a named review contact -- and fails
        # without them, after a build that was otherwise perfect.
        #
        # Internal testers do not need any of that: every processed build reaches an
        # internal group automatically. External review is a decision for the day this app
        # goes to people outside the family, and it can be made then.
        submit_to_testflight: false

    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"

  # The interface suites, kept out of the shipping path.
  #
  # They need named simulators, and a name this runner does not have would fail after the
  # archive was already built -- stopping the app reaching a phone for a reason that has
  # nothing to do with the app. They run on their own, and they gate nothing.
  interface-tests:
    name: The interface suites
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      # `xcodebuild` directly rather than through the wrapper. The wrapper adds
      # `-sdk iphonesimulator`, which is wrong for a scheme that embeds a watch app: the
      # watch target cannot be built against the phone SDK, so the run died before the app
      # compiled and reported "Executed 0 tests" -- a message that describes a broken test
      # suite and not, as here, a build that never happened. A destination alone is enough.
      #
      # No signing either: a simulator needs no signature, and this workflow holds no
      # credentials on purpose.
      - name: The phone
        script: |
          set -o pipefail
          xcodebuild test -project ios/VBTracker.xcodeproj -scheme VBTracker -destination 'platform=iOS Simulator,name=iPhone 17 Pro' CODE_SIGNING_ALLOWED=NO 2>&1 | tail -400

      - name: The watch, where the on-deck box is measured
        script: |
          set -o pipefail
          xcodebuild test -project ios/VBTracker.xcodeproj -scheme VBTrackerWatch -destination 'platform=watchOS Simulator,name=Apple Watch Ultra 2 (49mm)' CODE_SIGNING_ALLOWED=NO 2>&1 | tail -400

    # Run by hand, before anything ships. It is the only suite that can say whether a tap
    # does what it looks like it does, and the three bugs it was written for were every one
    # of them invisible to the domain suite.
    triggering:
      events: []

  # The listing, and the submission that follows it.
  #
  # Separate from the workflow that builds the app on purpose: a listing changes far more
  # often than a binary does, and a typo in a description should never mean waiting on an
  # archive. It uses the same App Store Connect key `ios-watch` already publishes with.
  store-listing:
    name: The App Store listing
    max_build_duration: 30
    integrations:
      app_store_connect: RLL_Codemagic_CI_AppManager
    environment:
      xcode: latest
      vars:
        # The one switch that submits. Left off, the run fills in the listing on App Store
        # Connect and stops there -- metadata and screenshots are private until a
        # submission is made, so that is safe and inspectable. Submitting for review is
        # public and cannot be quietly undone, so it is never a side effect of staging.
        SUBMIT_FOR_REVIEW: "no"
    scripts:
      - name: What the listing says
        script: |
          echo "Screenshots:"
          ls -la fastlane/screenshots/en-US
          echo
          echo "Keywords:  $(cat fastlane/metadata/en-US/keywords.txt)"
          echo "Support:   $(cat fastlane/metadata/en-US/support_url.txt)"
          echo "Privacy:   $(cat fastlane/metadata/en-US/privacy_url.txt)"

      # Names only. A value here would put the App Store Connect key in a build log
      # forever, which is the one thing this must never do.
      - name: Which credentials the integration provided
        script: |
          env | cut -d= -f1 | grep -E "APP_STORE|ASC_|CERTIFICATE" | sort || echo "(none matched)"

          # Shape, never content. A length of zero would say the integration named the
          # variable and put nothing in it, which looks identical to a key that cannot be
          # parsed once it reaches OpenSSL -- and four attempts went at the parsing.
          for name in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            value=$(eval printf '%s' "\$$name")
            chars=$(printf '%s' "$value" | wc -c | tr -d ' ')
            lines=$(printf '%s' "$value" | wc -l | tr -d ' ')
            begins=$(printf '%s' "$value" | grep -c BEGIN || true)
            echo "$name: $chars chars, $lines lines, BEGIN x$begins"
          done

      # Apple issues the App Store Connect key as PKCS#8, and Ruby's OpenSSL 3 will not
      # read an EC private key in that container. It says "invalid curve name", which names
      # neither the curve nor the problem, and survives being handed the key three
      # different ways because none of them was the issue.
      #
      # The `openssl` binary has no such trouble. Converting to SEC1 first is the whole fix.
      - name: Verify, or submit
        script: |
          set -o pipefail

          # What the integration puts in this variable is not the key. It is Codemagic's
          # own reference to where the key was written: `@file:` followed by a path.
          # Seventy-two characters, no newlines, no PEM header -- and every earlier attempt
          # handed that string to OpenSSL as though it were a key, which answered "invalid
          # curve name". Four rounds went at curves, encodings and Ruby versions. It was
          # never a curve, and it was never even a key.
          value="$APP_STORE_CONNECT_PRIVATE_KEY"
          case "$value" in
            @file:*)
              echo 'The variable is an @file: reference; reading what it points at.'
              cp "${value#@file:}" /tmp/asc.p8
              ;;
            *)
              if [ -f "$value" ]; then
                echo 'The variable is a path; reading the file.'
                cp "$value" /tmp/asc.p8
              else
                echo 'The variable holds the key itself.'
                printf '%b\n' "$value" > /tmp/asc.p8
              fi
              ;;
          esac
          chmod 600 /tmp/asc.p8
          echo "Key begins: $(head -1 /tmp/asc.p8)"

          if openssl ec -in /tmp/asc.p8 -out /tmp/asc_sec1.pem 2>/tmp/asc_convert.log; then
            chmod 600 /tmp/asc_sec1.pem
            export ASC_KEY_PATH=/tmp/asc_sec1.pem
            echo "Key converted to SEC1: $(head -1 /tmp/asc_sec1.pem)"
          else
            echo "Conversion failed, falling back to the key as issued:"
            cat /tmp/asc_convert.log
          fi

          if [ "$SUBMIT_FOR_REVIEW" = "yes" ]; then
            fastlane ios submit 2>&1 | tail -250
          else
            fastlane ios stage 2>&1 | tail -250
          fi

    triggering:
      events: []
