# The build machine. There is no Mac on the workstation, so this is the only place the
# iOS and watchOS targets are ever compiled -- and the only place a screen can be run.
#
# The domain package is tested first and alone. It is the part with real rules in it, it
# needs no simulator, and a failure there should stop the build before a minute is spent
# on anything with a screen.
workflows:
  vbcore:
    name: VBCore — the rulebook
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Test the domain, including parity with the shipped web app
        script: |
          cd packages/VBCore
          swift test
    triggering:
      events: [push, pull_request]

  # The cheapest way to find out whether 71 files of Swift compile.
  #
  # No signing, no simulators, no publishing, no upload. Just: does it build? Every error
  # this finds would otherwise have been found by a full build that spent forty minutes
  # getting there first, and the operator is paying for those minutes.
  compile:
    name: Does it compile?
    max_build_duration: 25
    environment:
      xcode: latest
    scripts:
      - name: The domain first, because it is cheapest and it holds the rules
        script: |
          cd packages/VBCore
          swift test

      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      # `build-for-testing` rather than `build`: it compiles the test targets too, and an
      # interface test that does not compile is a test that never runs.
      - name: Compile the phone, the watch, and their tests
        script: |
          xcodebuild build-for-testing             -project ios/VBTracker.xcodeproj             -scheme VBTracker             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO
      - name: Compile the watch on its own
        script: |
          xcodebuild build-for-testing             -project ios/VBTracker.xcodeproj             -scheme VBTrackerWatch             -destination 'generic/platform=watchOS Simulator'             CODE_SIGNING_ALLOWED=NO

    triggering:
      events: []

  ios-watch:
    name: iPhone and Watch
    max_build_duration: 60
    integrations:
      # Built once from the App Store Connect key, and reused by every future app.
      # The .p8 itself is uploaded to Codemagic by hand; the vault holds the copy every
      # other consumer uses.
      app_store_connect: RLL_Codemagic_CI_AppManager
    environment:
      xcode: latest
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY: the private half of the distribution certificate.
        # Apple issues the certificate, but only the holder of this key can use it -- so
        # without it the signing step can create a certificate and then not save it, which
        # is exactly what the first attempt did, quietly, while reporting success.
        - appstore_credentials
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Fetch the signing files, and create them where they do not exist yet.
      #
      # Declaring `ios_signing` only looks for profiles that are already there, and on a
      # brand new App ID there are none -- the first build died in under a second saying so.
      # `--create` makes the certificate and both profiles once, and finds them every time
      # after. Two bundle ids, because the watch app is signed as its own bundle.
      - name: Sign, creating the profiles the first time
        script: |
          app-store-connect fetch-signing-files "com.mikejsmith.vbtracker" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "com.mikejsmith.vbtracker.watchapp" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      # App Store Connect refuses a build number it has already seen, so the number comes
      # from the build itself rather than from a constant in the project that somebody has
      # to remember to raise.
      - name: Number this build
        script: |
          cd ios && agvtool new-version -all "$BUILD_NUMBER"

      - name: Test the domain first
        script: |
          cd packages/VBCore
          swift test

      # The whole build goes to a file, and its errors are reprinted at the end.
      #
      # Codemagic keeps no downloadable log for a step that fails, so a compile error here
      # was only ever readable by opening the web UI -- and the API, which is how this gets
      # driven, could not see it at all. The log is published as an artifact instead.
      - name: Build the phone and the watch it carries
        script: |
          set -o pipefail
          mkdir -p /tmp/logs
          status=0
          xcode-project build-ipa --project ios/VBTracker.xcodeproj --scheme VBTracker 2>&1 | tee /tmp/logs/build.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "==================== WHAT THE COMPILER SAID ===================="
            grep -E 'error:|The following build commands failed' /tmp/logs/build.log | head -40 || true
          fi
          exit "$status"

    artifacts:
      - /tmp/logs/*.log
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      # Which app to publish to is read from the bundle id in the built IPA -- there is no
      # app_id field here, and the number lives in CLAUDE.md where identifiers belong.
      app_store_connect:
        auth: integration
        # Uploaded, and nothing more. `submit_to_testflight` submits for EXTERNAL beta
        # review, which demands a feedback email and a named review contact -- and fails
        # without them, after a build that was otherwise perfect.
        #
        # Internal testers do not need any of that: every processed build reaches an
        # internal group automatically. External review is a decision for the day this app
        # goes to people outside the family, and it can be made then.
        submit_to_testflight: false

    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"

  # The interface suites, kept out of the shipping path.
  #
  # They need named simulators, and a name this runner does not have would fail after the
  # archive was already built -- stopping the app reaching a phone for a reason that has
  # nothing to do with the app. They run on their own, and they gate nothing.
  interface-tests:
    name: The interface suites
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate

      # `xcodebuild` directly rather than through the wrapper. The wrapper adds
      # `-sdk iphonesimulator`, which is wrong for a scheme that embeds a watch app: the
      # watch target cannot be built against the phone SDK, so the run died before the app
      # compiled and reported "Executed 0 tests" -- a message that describes a broken test
      # suite and not, as here, a build that never happened. A destination alone is enough.
      #
      # No signing either: a simulator needs no signature, and this workflow holds no
      # credentials on purpose.
      #
      # The whole run goes to a file and only a digest is printed at the end. A test log is
      # far longer than the build log keeps, so `tail` on the run itself threw away the
      # early failures and left five failing tests showing as one -- the four that mattered
      # had scrolled off before anybody could read them. The digest is last, so it survives.
      # Both suites run to the end even when one fails -- a phone failure used to stop the
      # watch suite from running at all, so a single broken tap hid whatever the watch had
      # to say. The verdict is passed at the end instead.
      #
      # Both suites leave stills and a digest behind. Video was tried and dropped: 134 MB
      # of it, zipped together with the digest by Codemagic, made the one small file that
      # explains a failure take longer to fetch than the build took to produce it.
      # First, because a simulator that cannot be named leaves xcodebuild with an empty
      # destination -- an error that reads like nothing at all and costs a whole run.
      - name: The simulator picker names devices correctly
        script: ./tests/ci/simulator-picker.test.sh

      - name: The phone
        script: ./scripts/ci-run-tests.sh 'iPhone' 'iPhone 17 Pro' VBTracker 'iOS Simulator' /tmp/phone.log
        ignore_failure: true

      - name: The watch, where the on-deck box is measured
        script: ./scripts/ci-run-tests.sh 'Apple Watch' 'Apple Watch Ultra 2 (49mm)' VBTrackerWatch 'watchOS Simulator' /tmp/watch.log
        ignore_failure: true

      - name: The verdict
        script: |
          set -u
          # Reprinted here so the reason is in the build log itself, not only in an
          # artifact somebody has to download to read.
          for digest in /tmp/digest/*.txt; do
            [ -f "$digest" ] && cat "$digest"
          done
          failed=0
          for log in /tmp/phone.log /tmp/watch.log; do
            [ -f "$log" ] || { echo "$log was never written"; failed=1; continue; }
            grep -qE '^\*\* TEST SUCCEEDED \*\*' "$log" || { echo "$(basename "$log"): failing"; failed=1; }
          done
          exit "$failed"

    # Small on purpose. Codemagic keeps no downloadable log for a step that failed, and it
    # zips every artifact into one file -- so anything large in here buries the one thing
    # worth reading.
    artifacts:
      - /tmp/shots/**/*.png
      - /tmp/digest/*.txt

    # Run by hand, before anything ships. It is the only suite that can say whether a tap
    # does what it looks like it does, and the three bugs it was written for were every one
    # of them invisible to the domain suite.
    triggering:
      events: []

  # The listing, and the submission that follows it.
  #
  # Separate from the workflow that builds the app on purpose: a listing changes far more
  # often than a binary does, and a typo in a description should never mean waiting on an
  # archive. It uses the same App Store Connect key `ios-watch` already publishes with.
  store-listing:
    name: The App Store listing
    max_build_duration: 30
    integrations:
      app_store_connect: RLL_Codemagic_CI_AppManager
    environment:
      xcode: latest
      vars:
        # The one switch that submits. Left off, the run fills in the listing on App Store
        # Connect and stops there -- metadata and screenshots are private until a
        # submission is made, so that is safe and inspectable. Submitting for review is
        # public and cannot be quietly undone, so it is never a side effect of staging.
        SUBMIT_FOR_REVIEW: "no"
    scripts:
      - name: What the listing says
        script: |
          echo "Screenshots:"
          ls -la fastlane/screenshots/en-US
          echo
          echo "Keywords:  $(cat fastlane/metadata/en-US/keywords.txt)"
          echo "Support:   $(cat fastlane/metadata/en-US/support_url.txt)"
          echo "Privacy:   $(cat fastlane/metadata/en-US/privacy_url.txt)"

      # Names only. A value here would put the App Store Connect key in a build log
      # forever, which is the one thing this must never do.
      - name: Which credentials the integration provided
        script: |
          env | cut -d= -f1 | grep -E "APP_STORE|ASC_|CERTIFICATE" | sort || echo "(none matched)"

          # Shape, never content. A length of zero would say the integration named the
          # variable and put nothing in it, which looks identical to a key that cannot be
          # parsed once it reaches OpenSSL -- and four attempts went at the parsing.
          for name in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            value=$(eval printf '%s' "\$$name")
            chars=$(printf '%s' "$value" | wc -c | tr -d ' ')
            lines=$(printf '%s' "$value" | wc -l | tr -d ' ')
            begins=$(printf '%s' "$value" | grep -c BEGIN || true)
            echo "$name: $chars chars, $lines lines, BEGIN x$begins"
          done

      # Apple issues the App Store Connect key as PKCS#8, and Ruby's OpenSSL 3 will not
      # read an EC private key in that container. It says "invalid curve name", which names
      # neither the curve nor the problem, and survives being handed the key three
      # different ways because none of them was the issue.
      #
      # The `openssl` binary has no such trouble. Converting to SEC1 first is the whole fix.
      # fastlane 2.233 creates a review submission and never adds the version to it, so
      # Apple is handed an empty submission and answers "not in valid state" -- which
      # describes the version rather than the submission and sends you looking in the wrong
      # place. Codemagic's own CLI speaks the newer submission model; this finds out what it
      # offers rather than guessing at a subcommand.
      # The listing, uploaded but not submitted. fastlane is good at this part.
      - name: Upload the listing
        script: |
          set -o pipefail
          value="$APP_STORE_CONNECT_PRIVATE_KEY"
          case "$value" in
            @file:*) cp "${value#@file:}" /tmp/asc.p8 ;;
            *) if [ -f "$value" ]; then cp "$value" /tmp/asc.p8; else printf '%s' "$value" > /tmp/asc.p8; fi ;;
          esac
          chmod 600 /tmp/asc.p8
          openssl ec -in /tmp/asc.p8 -out /tmp/asc_sec1.pem 2>/dev/null && export ASC_KEY_PATH=/tmp/asc_sec1.pem
          fastlane ios stage 2>&1 | tail -80

      # And the submission, which fastlane cannot do. It creates a review submission and
      # never adds the version to it, so Apple is handed an empty one and answers
      # "appStoreVersions is not in valid state" -- a message about the version, when the
      # fault is the submission having nothing in it.
      #
      # Codemagic's own CLI speaks the newer three-step model: create the submission, add
      # the version to it, confirm it.
      - name: Submit for review
        script: |
          if [ "$SUBMIT_FOR_REVIEW" != "yes" ]; then
            echo "SUBMIT_FOR_REVIEW is not yes. The listing is staged and nothing was submitted."
            exit 0
          fi
          set -e

          APP_ID=6806672687

          echo "--- the version to submit ---"
          VERSION_ID=$(app-store-connect apps app-store-versions "$APP_ID" --json 2>/dev/null             | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(v['id'] for v in d if v['attributes']['appStoreState'] in ('PREPARE_FOR_SUBMISSION','DEVELOPER_REJECTED','REJECTED','METADATA_REJECTED')))" 2>/dev/null || true)
          if [ -z "$VERSION_ID" ]; then
            echo "Could not read the version id from the CLI; listing what it does return:"
            app-store-connect apps app-store-versions "$APP_ID" --json 2>&1 | head -40
            exit 1
          fi
          echo "Version: $VERSION_ID"

          echo "--- create the submission ---"
          SUBMISSION_ID=$(app-store-connect review-submissions create "$APP_ID" --platform IOS --json             | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Submission: $SUBMISSION_ID"

          # From here on, a failure takes its own submission away with it. An abandoned
          # draft blocks the next attempt, and asking somebody to go and delete one by hand
          # after every failed run is a poor way to treat them.
          set +e
          echo "--- add the version to it ---"
          app-store-connect review-submission-items create "$SUBMISSION_ID" --version-id "$VERSION_ID"
          added=$?

          if [ $added -ne 0 ]; then
            echo "--- could not add the version; discarding the empty submission ---"
            # The cancel result is printed rather than swallowed. Last time it was hidden
            # behind `|| true` and the step announced that nothing was left behind while a
            # draft submission sat in the account waiting to be deleted by hand.
            app-store-connect review-submissions cancel "$SUBMISSION_ID"
            cancelled=$?
            if [ $cancelled -eq 0 ]; then
              echo "The empty submission was cancelled."
            else
              echo "COULD NOT CANCEL $SUBMISSION_ID -- it may need deleting by hand."
            fi
            exit 1
          fi

          echo "--- confirm ---"
          app-store-connect review-submissions confirm "$SUBMISSION_ID"
          confirmed=$?

          if [ $confirmed -ne 0 ]; then
            echo "--- could not confirm; discarding the submission ---"
            app-store-connect review-submissions cancel "$SUBMISSION_ID"
            [ $? -eq 0 ] && echo "The submission was cancelled." || echo "COULD NOT CANCEL $SUBMISSION_ID."
            exit 1
          fi
          echo "Submitted for review."

    triggering:
      events: []

  # Which build the version under review carries.
  #
  # A rejected version keeps the build it was rejected with, and answering App Review with a
  # recording of a build that is not attached tells them about an app they cannot open. This
  # reads the state first and only changes it when told to, by number, so the switch is never
  # a side effect of looking.
  store-build:
    name: The build under review
    max_build_duration: 20
    integrations:
      app_store_connect: RLL_Codemagic_CI_AppManager
    environment:
      xcode: latest
      vars:
        # Empty means read and report. A number means attach that build to the version.
        ATTACH_BUILD: ""
    scripts:
      - name: What the version carries, and what it could carry
        script: |
          set -e
          APP_ID=6806672687

          echo "=================== THE VERSION ==================="
          app-store-connect apps app-store-versions "$APP_ID" --json | head -80

          echo
          echo "=================== BUILDS APPLE HOLDS ==================="
          app-store-connect builds list --application-id "$APP_ID" --json | head -120

      - name: Attach the build, if one was named
        script: |
          set -e
          APP_ID=6806672687

          if [ -z "$ATTACH_BUILD" ]; then
            echo "ATTACH_BUILD is empty. Nothing was changed."
            exit 0
          fi

          echo "Attaching build $ATTACH_BUILD to the editable version."
          app-store-connect publish \
            --application-id "$APP_ID" \
            --build-version-number "$ATTACH_BUILD" \
            || echo "Could not attach by that route; see the state printed above."

    triggering:
      events: []
