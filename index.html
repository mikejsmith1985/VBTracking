<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale + user-scalable=no suppress double-tap and pinch zoom (FR-049).
     viewport-fit=cover lets the CSS reach under the notch and home indicator (FR-051). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">

<!-- iOS below 16.4 does not honour the manifest's display mode; this does. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serve Tracker">

<title>Volleyball Serve Tracker</title>

<!-- Every path here is relative: GitHub Pages serves from a subpath, and a root-absolute
     reference would 404 there and break install and offline silently. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles/app.css">
<link rel="stylesheet" href="./styles/v3.css">
</head>
<body>

<div class="app">
  <div id="banner" class="banner" hidden></div>
  <main id="screen" class="screen"></main>
  <div id="dock" class="dock"></div>
  <nav class="tabbar">
    <button class="tab" data-action="tab" data-tab="track" type="button">Track</button>
    <button class="tab" data-action="tab" data-tab="stats" type="button">Game</button>
    <button class="tab" data-action="tab" data-tab="season" type="button">Season</button>
    <button class="tab" data-action="tab" data-tab="roster" type="button">Roster</button>
  </nav>
</div>

<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
