# The Xcode project, as a file a person can read.
#
# There is no Mac on the workstation, so a .pbxproj could not be opened here even to
# inspect it -- let alone hand-edited safely. XcodeGen turns this into the project on the
# build machine, which keeps the thing under version control readable and diffable.
name: VBTracker

options:
  bundleIdPrefix: com.mikejsmith
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode synthesises Info.plist from the INFOPLIST_KEY_* settings below. Without this
    # the keys are read and then thrown away, and the watch app is assembled with no
    # Info.plist at all -- which fails at the very last step, after everything compiled.
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    # 1.1, not 1.0. Version 1.0 is sitting in the review queue with build 25 attached, and
    # everything since -- the second phone, the lock screen, the board -- is a feature
    # release. Uploading it under 1.0 would not disturb that submission, but it would leave
    # both trains sharing a version number, where reselecting a build is one mis-click.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    # Warnings are not advice. A season of real data is riding on this.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  VBCore:
    path: ../packages/VBCore

targets:
  # --- iPhone -----------------------------------------------------------------
  VBTracker:
    type: application
    platform: iOS
    sources:
      - path: VBTracker
      - path: Shared
      # Its own folder rather than `Shared`, because `Shared` is compiled into the watch app
      # too and watchOS has no ActivityKit -- the same trap the phone-to-phone radio fell in.
      - path: GlanceShared
    dependencies:
      - package: VBCore
        product: VBCore
      - package: VBCore
        product: VBStore
      - package: VBCore
        product: VBPresentation
      - target: VBTrackerWatch
        embed: true
      - target: VBTrackerGlance
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikejsmith.vbtracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only, and portrait only. Apple demands all four orientations from anything
        # that claims to run on an iPad -- so an app that is genuinely one-handed and
        # portrait has to say it is not an iPad app. It never was: the whole design is a
        # phone held in one hand at the side of a court.
        TARGETED_DEVICE_FAMILY: "1"
        # This app uses no encryption of any kind: no network, no accounts, nothing to
        # encrypt and nothing to encrypt it with. Saying so here answers the export
        # compliance question once, at build time -- otherwise every single build lands in
        # TestFlight marked "Missing Compliance" and reaches nobody until someone answers
        # the same question by hand again.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # A file type of the app's own, so a season sent by AirDrop offers this app by name
    # instead of landing in Files for somebody to go and find. The synthesised Info.plist
    # cannot hold arrays, which is what a document type is, so these keys are merged in
    # from a file beside it -- Xcode combines the two when both are present.
    info:
      path: VBTracker/Info.plist
      properties:
        # Without this the app may not start a Live Activity at all, and the request fails
        # quietly rather than loudly.
        NSSupportsLiveActivities: true
        # Sharing a match with a second phone. iOS refuses a local-network connection
        # without this string, and shows it verbatim in the prompt -- so it says what the
        # radio is for and, just as importantly, what it is not.
        NSLocalNetworkUsageDescription: >-
          Serve Tracker uses the local network to share the match with a second phone in the
          same gym, so an assistant coach sees the same figures. Nothing is sent over the
          internet and nothing leaves the two devices.
        # The service both phones look for. Without it the browser finds nobody, silently.
        NSBonjourServices:
          - _vb-serve._tcp
          - _vb-serve._udp
        # Declaring a document type without this is an ITMS-90737 warning on every upload.
        # NO, not YES: a season that arrives is read once and merged into this app's own log,
        # and the file itself is never written back to. Saying the app opens documents in
        # place would promise an editor it is not, and would leave the operator's own file
        # open to being changed by an app they only asked to read it.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Volleyball season
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.mikejsmith.vbtracker.season
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.mikejsmith.vbtracker.season
            UTTypeDescription: Volleyball season
            # It is JSON underneath, and saying so lets anything that reads JSON still open
            # it. The app is only claiming this one extension, not every JSON file on the
            # phone.
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - vbseason
    entitlements:
      path: VBTracker/VBTracker.entitlements
      properties:
        # Derived from the bundle id, per the global naming rule. A later widget or
        # complication reads the same log rather than keeping a second copy of it.
        com.apple.security.application-groups:
          - group.com.mikejsmith.vbtracker

  # --- The lock screen ---------------------------------------------------------
  #
  # A Live Activity, not a widget. A widget refreshes on a timeline the system decides, and a
  # court that updates when iOS feels like it is a court nobody may act on.
  VBTrackerGlance:
    type: app-extension
    platform: iOS
    sources:
      - path: VBTrackerGlance
      - path: GlanceShared
    dependencies:
      - package: VBCore
        product: VBCore
      - package: VBCore
        product: VBPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikejsmith.vbtracker.glance
        INFOPLIST_KEY_CFBundleDisplayName: Serve Tracker
        SKIP_INSTALL: YES
        ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # An extension point is a nested key, and a build setting cannot nest. Written as
    # INFOPLIST_KEY_NSExtensionPointIdentifier it lands at the top level of the plist,
    # where the archive is happy and the App Store is not: the upload was refused with
    # ITMS-90348 after a clean build, which is the slowest way possible to find out.
    info:
      path: VBTrackerGlance/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # No entitlements, and specifically no App Group. A Live Activity is handed its state by
    # the app through ActivityKit; it never opens the log itself. Claiming the group anyway
    # asked Apple for a provisioning profile with a capability nobody had granted this
    # identifier, and the archive refused outright.

  # --- Watch ------------------------------------------------------------------
  VBTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - path: VBTrackerWatch
      - path: Shared
    dependencies:
      - package: VBCore
        product: VBCore
      - package: VBCore
        product: VBPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikejsmith.vbtracker.watchapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A single-target watch app, the modern shape: one bundle, no extension beside it.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.mikejsmith.vbtracker
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_CFBundleDisplayName: Serve Tracker
    entitlements:
      path: VBTrackerWatch/VBTrackerWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mikejsmith.vbtracker

  # --- Tests ------------------------------------------------------------------
  SharedTests:
    type: bundle.unit-test
    platform: iOS
    # `Shared` is compiled into each app rather than into a framework of its own, so the
    # test bundle compiles it too. A framework would be a third thing to sign for no gain.
    sources: [SharedTests, Shared]
    dependencies:
      - target: VBTracker
      - package: VBCore
        product: VBCore
      - package: VBCore
        product: VBPresentation

  VBTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VBTrackerUITests]
    dependencies:
      - target: VBTracker

  VBTrackerWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [VBTrackerWatchUITests]
    dependencies:
      - target: VBTrackerWatch

schemes:
  VBTracker:
    build:
      targets:
        VBTracker: all
        VBTrackerWatch: all
    test:
      targets: [SharedTests, VBTrackerUITests]
  VBTrackerWatch:
    build:
      targets:
        VBTrackerWatch: all
    test:
      targets: [VBTrackerWatchUITests]
